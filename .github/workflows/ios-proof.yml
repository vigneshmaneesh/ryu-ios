name: iOS 27 JIT proof of concept

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'src/Ryujinx.Cpu/LightningJit/**'
      - 'src/ARMeilleure/**'
      - '.github/workflows/ios-proof.yml'
      - 'Directory.Build.props'
      - 'global.json'

permissions:
  contents: read

concurrency:
  group: ios-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-logging:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Check actual iOS console runtime
        working-directory: ios
        run: |
          python3 scripts/prepare_core.py
          bash scripts/check-ios-logging.sh
  build:
    # Keep the zero-cost constraint: this workflow only runs in a PUBLIC repository.
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Build and verify re-signable IPA
        run: bash ios/scripts/build-ios.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RyuJIT-iOS27
          path: |
            ios/build/RyuJIT-iOS27.ipa
            ios/build/RyuJIT-iOS27.ipa.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
