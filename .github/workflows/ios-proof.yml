name: Native iOS 27 build

on:
  workflow_dispatch:
    inputs:
      extended_checks:
        description: Run the full CPU/kernel/simulator regression suite
        type: boolean
        default: false
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-proof.yml'
      - 'Directory.Build.props'
      - 'global.json'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homebrew:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: devkitpro/devkita64@sha256:82575ea78651b530b2e232bb3799cfd1fe331514e053d5f724bb4b28191fb79d
    steps:
      - uses: actions/checkout@v4
      - name: Build the bundled graphics homebrew
        run: |
          make -j2 -C ios/HomebrewGraphics
          dkp-pacman -Q > ios/HomebrewGraphics/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ryu-graphics-homebrew
          path: |
            ios/HomebrewGraphics/deko_basic.nro
            ios/HomebrewGraphics/NOTICE.txt
            ios/HomebrewGraphics/toolchain.txt
          retention-days: 1
  build:
    if: github.event.repository.private == false
    needs: homebrew
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RYU_EXTENDED_CHECKS: ${{ inputs.extended_checks && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/download-artifact@v4
        with:
          name: Ryu-graphics-homebrew
          path: ios/build/homebrew
      - name: Build IPA and smoke-boot graphics homebrew once
        run: bash ios/scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RyuJIT-iOS27
          path: |
            ios/build/RyuJIT-iOS27.ipa
            ios/build/RyuJIT-iOS27.ipa.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  extended:
    if: github.event.repository.private == false && inputs.extended_checks
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Optional iOS runtime regressions
        working-directory: ios
        run: |
          python3 scripts/prepare_core.py
          bash scripts/check-ios-logging.sh
